<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aces Video | Annotation studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101519;color:#edf4f2;font:16px system-ui}header,main{max-width:900px;margin:auto;padding:24px}header{color:#80e5be;font-weight:750;border-bottom:1px solid #36403e}h1{font-size:clamp(30px,6vw,48px)}video{width:100%;max-height:48vh;background:#080b0c;margin:20px 0}textarea{display:block;width:100%;padding:12px;background:#1c262a;color:white;border:1px solid #748481;border-radius:6px}button{padding:10px 16px;margin:12px 6px 0 0;background:#93eac6;color:#10231b;border:0;border-radius:6px;font-weight:bold}li{padding:8px;white-space:pre-wrap}small{color:#c1d1ca}</style>
<header>Aces Video</header><main><h1>Annotation studio</h1><label>Open video or audio <input id="file" type="file" accept="video/*,audio/*"></label><video id="player" controls></video><label>Annotation at current playback time<textarea id="note" rows="3"></textarea></label><button id="save" disabled>Add annotation</button><button id="download" disabled>Export JSON</button><p><small>Drafts are saved in this browser. Export a copy to share.</small></p><p id="status" role="status"></p><ol id="list"></ol></main>
<script>
const el=id=>document.getElementById(id);
let key,url,rows=[];
function render(){el('list').replaceChildren(...rows.map(row=>{const item=document.createElement('li');item.textContent=row.seconds.toFixed(2)+' s · '+row.note;return item}));el('download').disabled=!rows.length}
el('file').onchange=()=>{const f=el('file').files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);el('player').src=url;key='aces-drafts:'+JSON.stringify([f.name,f.size,f.lastModified]);el('note').value='';el('status').textContent='';try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch{rows=[];el('status').textContent='Draft storage unavailable. Export your work.'}el('save').disabled=false;render()};
el('save').onclick=()=>{const note=el('note').value.trim();if(!note){el('note').focus();return}rows.push({seconds:el('player').currentTime,note});try{localStorage.setItem(key,JSON.stringify(rows));el('status').textContent='Draft saved in this browser.'}catch{el('status').textContent='Browser storage unavailable. Export before closing.'}el('note').value='';render()};
el('download').onclick=()=>{const a=document.createElement('a');const blob=URL.createObjectURL(new Blob([JSON.stringify({media:el('file').files[0].name,annotations:rows},null,2)],{type:'application/json'}));a.href=blob;a.download='aces-annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(blob),1000)};
</script></html>
